<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171512">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Your place in the WaxTime listening circle is confirmed.">
  <title>You’re in — WaxTime</title>
  <link rel="icon" type="image/png" href="waxtime-logo.png">
  <style>
    :root {
      --ink: #171512;
      --cream: #f3ead8;
      --muted: #b8ad9b;
      --orange: #e66b32;
      --line: rgba(243, 234, 216, .14);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      color: var(--cream);
      background:
        radial-gradient(circle at 75% 25%, rgba(230, 107, 50, .12), transparent 32%),
        var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    a { color: inherit; text-decoration: none; }
    .wrap { width: min(calc(100% - 40px), 980px); margin-inline: auto; }
    header, footer { border-color: var(--line); border-style: solid; border-width: 0; }
    header { border-bottom-width: 1px; }
    footer { border-top-width: 1px; color: var(--muted); }
    .nav, .footer-inner { min-height: 78px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.02em; }
    .brand img { width: 38px; aspect-ratio: 1; display: block; border-radius: 50%; object-fit: cover; }
    .home-link { color: var(--muted); font-size: .9rem; }
    .home-link:hover, .home-link:focus-visible { color: var(--cream); }

    main { display: grid; place-items: center; padding-block: 70px; }
    .confirmation { max-width: 760px; text-align: center; }
    .logo { width: clamp(92px, 15vw, 128px); aspect-ratio: 1; margin: 0 auto 34px; display: block; border-radius: 50%; }
    .eyebrow { color: var(--orange); font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 16px 0 22px; font: 500 clamp(3.5rem, 10vw, 7rem)/.9 Georgia, "Times New Roman", serif; letter-spacing: -.06em; }
    .lead { max-width: 610px; margin: 0 auto 36px; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.25rem); }
    .button { display: inline-flex; min-height: 52px; padding: 0 24px; align-items: center; justify-content: center; border-radius: 999px; color: var(--ink); background: var(--orange); font-weight: 800; transition: transform .2s ease, background .2s ease; }
    .button:hover { transform: translateY(-2px); background: #ff8950; }
    .signature { margin: 42px 0 0; color: var(--cream); font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    .footer-inner { font-size: .85rem; }
    .footer-links { display: flex; gap: 20px; }

    @media (max-width: 600px) {
      .wrap { width: min(calc(100% - 28px), 980px); }
      .nav { min-height: 68px; }
      .home-link { display: none; }
      main { padding-block: 52px; }
      .button { width: 100%; }
      .footer-inner { padding-block: 22px; align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav wrap" aria-label="Main navigation">
      <a class="brand" href="index.html"><img src="waxtime-logo.png" alt="">WaxTime</a>
      <a class="home-link" href="index.html">Back to WaxTime</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="confirmation" aria-labelledby="confirmation-title">
      <img class="logo" src="waxtime-logo.png" alt="WaxTime">
      <span class="eyebrow">Email confirmed</span>
      <h1 id="confirmation-title">You’re in.</h1>
      <p class="lead">Welcome to the first WaxTime listening circle. We’ll keep you posted as WaxTime takes shape.</p>
      <a class="button" href="index.html">Back to WaxTime</a>
      <p class="signature">Make time. Play the record.</p>
    </section>
  </main>

  <footer>
    <div class="footer-inner wrap">
      <span>© <span id="year"></span> WaxTime</span>
      <span class="footer-links"><a href="imprint.html">Imprint</a><a href="privacy.html">Privacy</a></span>
    </div>
  </footer>
  <script>document.querySelector('#year').textContent = new Date().getFullYear();</script>
</body>
</html>
